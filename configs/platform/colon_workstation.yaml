# Production colon workstation: D capacity tier + E-backed Linux ext4 hot tier.

name: colon_workstation

# D remains the authoritative source/manifest tier.
project_root: /mnt/d/YC.Liu
slide_root: /mnt/d/YC.Liu/slides

# E ext4 owns all high-throughput and large generated data.
feature_root: /mnt/wsl/oceanpath-hot/features
output_root: /mnt/wsl/oceanpath-hot/outputs
scratch_root: /mnt/wsl/oceanpath-hot/scratch
wsi_cache: /mnt/wsl/oceanpath-hot/scratch/wsi_cache

# Split metadata is compact and stays with the invoking worktree by default.
# Override OCEANPATH_STATE_ROOT when a deliberately shared state location is
# required. A relative default is what keeps development worktrees isolated
# from the production encoder worktree.
state_root: ${oc.env:OCEANPATH_STATE_ROOT,outputs}
splits_root: ${platform.state_root}/splits

gpu: 0
num_gpus: 1

# MIL training on packed features is bound by host->device bandwidth, not by
# worker CPU: each sample is megabytes of feature matrix that must cross the
# worker IPC queue. Past ~4 workers the queue, not the reader, is the limit —
# measured 250 vs 249 slides/s at 10 vs 4 workers on the colon cohort — so the
# extra workers only cost RSS. Extraction can override this on its command line
# when tiling needs more CPU parallelism.
num_workers: 4
prefetch_factor: 2

precision: bf16-mixed          # bf16-mixed is safe for ABMIL (bf16 has fp32's
                               # exponent range, so the fp16 overflow guard in
                               # MILTrainModule does not apply) and is ~8% faster
                               # once dataloading is no longer the bottleneck.
strategy: auto
accelerator: auto
devices: 1
num_nodes: 1
